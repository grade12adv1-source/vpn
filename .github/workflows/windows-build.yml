name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Run tests
        run: |
          npm test 2>&1 | Tee-Object -FilePath test-output.txt
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $detail = (Get-Content test-output.txt | Select-Object -Last 80) -join "`n"
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows test failure::$detail"
          }
          exit $testExit
      - name: Build portable Windows app
        run: npm run dist:win
      - name: Upload download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Aero-VPN-Windows
          path: dist/Aero-VPN-*-win-x64.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
